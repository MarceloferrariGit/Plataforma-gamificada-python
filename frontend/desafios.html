<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio de Programação</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --border-color: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --success-color: #10b981;
            --error-color: #ef4444;
            --code-bg: #0b0f19;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
            text-align: center;
        }

        .header h1 {
            margin: 0;
            font-size: 1.5rem;
            color: var(--text-main);
        }

        .section {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .section-title {
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 10px;
            font-weight: 600;
        }

        .description {
            font-size: 1.1rem;
            line-height: 1.5;
            color: var(--text-main);
        }

        .code-area {
            background-color: var(--code-bg);
            border-radius: 8px;
            padding: 15px;
            font-family: 'Fira Code', 'Courier New', Courier, monospace;
            font-size: 0.95rem;
            line-height: 1.6;
            overflow-x: auto;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .code-line {
            color: #a78bfa;
        }

        .code-comment {
            color: #64748b;
            font-style: italic;
        }

        .actions {
            padding: 20px;
            display: flex;
            justify-content: flex-end;
            border-bottom: 1px solid var(--border-color);
        }

        .btn-execute {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 500;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-execute:hover {
            background-color: var(--accent-hover);
        }

        .feedback-container {
            padding: 20px;
            background-color: rgba(0, 0, 0, 0.15);
        }

        .feedback-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px;
            border-radius: 6px;
            font-weight: 500;
            margin-bottom: 10px;
        }

        .feedback-item:last-child {
            margin-bottom: 0;
        }

        .feedback-success {
            background-color: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.2);
            color: var(--success-color);
        }

        .feedback-error {
            background-color: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: var(--error-color);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Cabeçalho -->
        <div class="header">
            <h1>Desafio 1: Soma Simples</h1>
        </div>

        <!-- Enunciado -->
        <div class="section">
            <div class="section-title">Enunciado</div>
            <div class="description">
                Crie uma função que receba dois números e retorne a soma.
            </div>
        </div>

        <!-- Área de Código -->
        <div class="section">
            <div class="section-title">Área de Código</div>
            <div class="code-area">
                <span class="code-line">def</span> soma(a, b):<br>
                &nbsp;&nbsp;&nbsp;&nbsp;<span class="code-comment"># escreva seu código aqui</span><br>
                &nbsp;&nbsp;&nbsp;&nbsp;
            </div>
        </div>

        <!-- Ações -->
        <div class="actions">
            <button class="btn-execute">Executar Código</button>
        </div>

        <!-- Feedback -->
        <div class="feedback-container">
            <div class="section-title">Feedback</div>
            
            <!-- Exemplo de Sucesso -->
            <div class="feedback-item feedback-success">
                <span>✔</span> Sua resposta está correta!
            </div>

            <!-- Exemplo de Erro -->
            <div class="feedback-item feedback-error">
                <span>✖</span> Resultado incorreto. Tente novamente.
            </div>
        </div>
    </div>

</body>
</html>
