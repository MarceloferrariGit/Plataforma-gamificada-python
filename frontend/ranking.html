<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranking</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --border-color: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-color: #3b82f6;
            --gold: #f59e0b;
            --silver: #94a3b8;
            --bronze: #b45309;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        /* Cabeçalho */
        .header {
            padding: 25px 20px;
            border-bottom: 1px solid var(--border-color);
            text-align: center;
        }

        .header h1 {
            margin: 0;
            font-size: 1.6rem;
            color: var(--text-main);
            font-weight: 700;
            letter-spacing: 0.05em;
        }

        /* Tabela de Classificação */
        .table-container {
            padding: 10px 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            margin: 10px 0;
        }

        th {
            color: var(--text-muted);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 12px 16px;
            font-weight: 600;
            border-bottom: 2px solid var(--border-color);
        }

        td {
            padding: 16px;
            font-size: 1rem;
            border-bottom: 1px solid rgba(51, 65, 85, 0.5);
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background-color: rgba(255, 255, 255, 0.02);
        }

        /* Alinhamentos Específicos */
        .col-pos { width: 15%; text-align: center; }
        .col-user { width: 45%; }
        .col-xp { width: 25%; font-weight: 600; color: var(--accent-color); }
        .col-lvl { width: 15%; text-align: center; }

        /* Estilização dos Medalhistas */
        .badge {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            font-weight: 700;
            font-size: 0.9rem;
        }

        .rank-1 .badge { background-color: rgba(245, 158, 11, 0.15); color: var(--gold); border: 1px solid rgba(245, 158, 11, 0.3); }
        .rank-2 .badge { background-color: rgba(148, 163, 184, 0.15); color: var(--silver); border: 1px solid rgba(148, 163, 184, 0.3); }
        .rank-3 .badge { background-color: rgba(180, 83, 9, 0.15); color: var(--bronze); border: 1px solid rgba(180, 83, 9, 0.3); }
        .rank-normal { color: var(--text-muted); font-weight: 500; }

        /* Observação / Notas */
        .note-panel {
            padding: 20px;
            background-color: rgba(0, 0, 0, 0.15);
            border-top: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .note-icon {
            color: var(--accent-color);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Cabeçalho -->
        <div class="header">
            <h1>Ranking</h1>
        </div>

        <!-- Tabela de Classificação -->
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th class="col-pos">Posição</th>
                        <th class="col-user">Usuário</th>
                        <th class="col-xp">Pontuação</th>
                        <th class="col-lvl">Nível</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- 1º Lugar -->
                    <tr class="rank-1">
                        <td class="col-pos"><span class="badge">1</span></td>
                        <td class="col-user">Aluno_A</td>
                        <td class="col-xp">980 XP</td>
                        <td class="col-lvl">5</td>
                    </tr>
                    <!-- 2º Lugar -->
                    <tr class="rank-2">
                        <td class="col-pos"><span class="badge">2</span></td>
                        <td class="col-user">Aluno_B</td>
                        <td class="col-xp">870 XP</td>
                        <td class="col-lvl">4</td>
                    </tr>
                    <!-- 3º Lugar -->
                    <tr class="rank-3">
                        <td class="col-pos"><span class="badge">3</span></td>
                        <td class="col-user">Aluno_C</td>
                        <td class="col-xp">820 XP</td>
                        <td class="col-lvl">4</td>
                    </tr>
                    <!-- 4º Lugar em diante -->
                    <tr>
                        <td class="col-pos"><span class="rank-normal">4</span></td>
                        <td class="col-user">Aluno_D</td>
                        <td class="col-xp">600 XP</td>
                        <td class="col-lvl">3</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Observação -->
        <div class="note-panel">
            <span class="note-icon">ℹ</span>
            <span>Observação: Ranking atualizado automaticamente.</span>
        </div>
    </div>

</body>
</html>
